[project]
name = "waveroot"
version = "0.1.0"
description = "Local-first RTL waveform comparison and causal debugging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pyslang>=12,<13",
]

[project.scripts]
waveroot = "src.app.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

# The team imports `src.waveform`, `src.causal` and `src.app`, so the package
# is shipped under its existing name. uv installs the project editable, which
# puts the repository root on sys.path: `waveroot` then also finds the
# benchmark golden models (`benchmarks.*`). It is meant for a checkout, not a
# published wheel.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1,<2",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: tests requiring external simulators or conversion tools",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
